<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>12 Runes — Opciones</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #111827;
        --text-muted: #6b7280;
        --border: #d1d5db;
        --readonly-bg: #f3f4f6;
        --readonly-text: #4b5563;
        --success: #16a34a;
        --footer-border: #e5e7eb;
        --link: #4b5563;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --text: #f3f4f6;
          --text-muted: #9ca3af;
          --border: #3a3f4b;
          --readonly-bg: #21242b;
          --readonly-text: #d1d5db;
          --success: #4ade80;
          --footer-border: #2d313a;
          --link: #93c5fd;
        }
      }
      body { font-family: system-ui, sans-serif; max-width: 420px; margin: 32px auto; padding: 0 16px; color: var(--text); background: var(--bg); }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; color: var(--text); background: var(--bg); }
      button { margin-top: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
      #status { margin-left: 8px; font-size: 12px; color: var(--success); }
      .field { margin-top: 22px; }
      #contributorId { color: var(--readonly-text); background: var(--readonly-bg); }
      .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
      footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--footer-border); font-size: 12px; }
      footer a { color: var(--link); }
    </style>
  </head>
  <body>
    <h1>12 Runes</h1>
    <label for="backendUrl">URL del servidor</label>
    <input id="backendUrl" type="url" placeholder="https://one2-runes.onrender.com" />
    <button id="save">Guardar</button>
    <span id="status"></span>

    <div class="field">
      <label for="contributorId">Tu identificador anónimo</label>
      <input id="contributorId" type="text" readonly />
      <p class="hint">
        No es tu cuenta de tcg-arena.fr ni de Google, es un id aleatorio generado en este
        navegador. Inclúyelo si escribes para pedir que se borren tus partidas grabadas.
      </p>
    </div>

    <footer>
      <a href="https://one2-runes.onrender.com/privacy.html" target="_blank" rel="noopener">Política de privacidad</a>
    </footer>
    <script src="options.js"></script>
  </body>
</html>
