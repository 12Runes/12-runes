<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>12 Runes</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; max-height: 420px; overflow-y: auto; padding: 12px; color: #111827; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .match { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
      .match .top { display: flex; justify-content: space-between; font-weight: 600; }
      .result-WIN { color: #16a34a; }
      .result-LOSS { color: #dc2626; }
      .result-UNKNOWN { color: #6b7280; }
      .meta { color: #6b7280; margin-top: 2px; }
      .status { margin-top: 4px; }
      .uploaded { color: #16a34a; }
      .pending { color: #d97706; }
      button.link { background: none; border: none; color: #2563eb; font-size: 11px; cursor: pointer; padding: 0; margin-top: 4px; }
      #empty { color: #6b7280; font-size: 12px; }
      footer { margin-top: 10px; display: flex; gap: 8px; }
      footer button { flex: 1; font-size: 11px; padding: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>12 Runes</h1>
    <button id="open-dashboard" style="width:100%; padding:8px; margin-bottom:10px; cursor:pointer; font-size:12px; font-weight:600;">Ver panel de estadísticas</button>
    <div id="list"></div>
    <div id="empty" hidden>Todavía no hay partidas guardadas.</div>
    <footer>
      <button id="options">Configurar servidor</button>
      <button id="export">Exportar todo (JSON)</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
